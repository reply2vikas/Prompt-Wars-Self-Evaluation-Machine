<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PromptWars Self-Scorer</title>
<style>
  :root {
    --pitch: #0b1411;        /* floodlit-night pitch */
    --panel: #101d18;
    --line: #21362c;         /* pitch chalk lines */
    --ink: #e7f0ea;
    --muted: #7d9488;
    --amber: #f2b03d;        /* floodlight */
    --grass: #3ecf8e;        /* pass */
    --red: #ef6f6f;          /* fail */
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--pitch); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--amber); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  form { display: grid; gap: 12px; margin-bottom: 24px; }
  label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  input, textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  button {
    background: var(--amber); color: #1a1206; border: 0; border-radius: 8px;
    padding: 11px 20px; font-weight: 650; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .scoreboard {
    display: flex; align-items: baseline; gap: 14px; margin: 8px 0 20px;
    border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; background: var(--panel);
  }
  .composite { font: 700 46px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .composite small { font-size: 18px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--panel); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-weight: 600; text-transform: capitalize; }
  .w { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .val { font: 700 26px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: #0a1512; border-radius: 999px; margin: 10px 0 8px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
  .why { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .fixes { margin: 8px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); }
  .fixes li { margin: 2px 0; }
  .flags { margin-top: 22px; border-left: 3px solid var(--red); padding: 4px 0 4px 14px; }
  .flags h3 { margin: 0 0 6px; font-size: 13px; color: var(--red); letter-spacing: .04em; }
  .flags div { font-size: 13px; color: var(--ink); margin: 3px 0; }
  .artifacts { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--panel); }
  .artifacts summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .artifacts > div { margin-top: 12px; }
  .links { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--panel); }
  .links h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .links a { color: var(--amber); text-decoration: none; word-break: break-all; }
  .links a:hover { text-decoration: underline; }
  .links .brief { color: var(--ink); font-size: 13px; margin-top: 6px; }
  .err { color: var(--red); font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PromptWars <span>Self-Scorer</span></h1>
    <p class="sub">A proxy for the six-parameter grader — deterministic checks plus an LLM judge. Approximation, not ground truth.</p>
  </header>

  <form id="f">
    <div>
      <label for="repo">Repo path (local, absolute or ~)</label>
      <input id="repo" placeholder="~/code/volunteer-copilot" required />
    </div>
    <div class="row">
      <div>
        <label for="model">Judge model</label>
        <input id="model" placeholder="claude-sonnet-4-5" />
      </div>
      <div style="flex:0 0 auto">
        <button id="go" type="submit">Score</button>
      </div>
    </div>
    <div>
      <label for="challenge">Challenge statement (optional — defaults to Challenge 4)</label>
      <textarea id="challenge" placeholder="Leave blank to use the built-in Smart Stadiums statement"></textarea>
    </div>

    <details class="artifacts">
      <summary>Submission artifacts (optional — overrides submission.json)</summary>
      <div class="row">
        <div><label for="app_live_link">App / live link</label><input id="app_live_link" placeholder="https://…" /></div>
        <div><label for="deck_link">Deck link</label><input id="deck_link" placeholder="https://…" /></div>
      </div>
      <div class="row">
        <div><label for="demo_video_link">Demo video</label><input id="demo_video_link" placeholder="https://…" /></div>
        <div><label for="linkedin_post_link">LinkedIn post</label><input id="linkedin_post_link" placeholder="https://…" /></div>
      </div>
      <div>
        <label for="prototype_brief">Prototype brief / about the project</label>
        <textarea id="prototype_brief" placeholder="One-paragraph before/after story: persona, the moment GenAI improves, why it matters"></textarea>
      </div>
    </details>
  </form>

  <div id="out" aria-live="polite"></div>

  <footer>Runs the scorer server-side against a local path. Local dev tool — don't expose publicly.</footer>
</div>

<script>
const W = { code_quality:"High", problem_alignment:"High", security:"Med", efficiency:"Med", testing:"Low", accessibility:"Low" };
const ORDER = ["code_quality","problem_alignment","security","efficiency","testing","accessibility"];
const out = document.getElementById("out");

function color(s){ return s >= 90 ? "var(--grass)" : s >= 70 ? "var(--amber)" : "var(--red)"; }
function esc(t){ const d=document.createElement("div"); d.textContent=t??""; return d.innerHTML; }

function render(data){
  const cards = ORDER.map(k => {
    const p = data.parameters[k];
    const fixes = (p.fixes||[]).map(f=>`<li>${esc(f)}</li>`).join("");
    return `<div class="card">
      <div class="top"><span class="name">${k.replace(/_/g," ")}</span><span class="w">${W[k]}</span></div>
      <div class="val" style="color:${color(p.score)}">${p.score}</div>
      <div class="track"><div class="fill" style="width:${p.score}%;background:${color(p.score)}"></div></div>
      <p class="why">${esc(p.rationale)}</p>
      ${fixes ? `<ul class="fixes">${fixes}</ul>` : ""}
    </div>`;
  }).join("");
  const flags = (data.flags||[]).length
    ? `<div class="flags"><h3>Flags</h3>${data.flags.map(f=>`<div>⚠ ${esc(f)}</div>`).join("")}</div>` : "";
  const s = data.submission || {};
  const linkRow = (label, url) => url ? `<div><strong>${label}:</strong> <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>` : "";
  const links = (s.app_live_link || s.deck_link || s.demo_video_link || s.linkedin_post_link || s.prototype_brief)
    ? `<div class="links"><h3>Submission artifacts</h3>
        ${linkRow("App / live", s.app_live_link)}${linkRow("Deck", s.deck_link)}
        ${linkRow("Demo video", s.demo_video_link)}${linkRow("LinkedIn", s.linkedin_post_link)}
        ${s.prototype_brief ? `<div class="brief">${esc(s.prototype_brief)}</div>` : ""}</div>` : "";
  out.innerHTML = `
    <div class="scoreboard">
      <div class="composite" style="color:${color(data.composite)}">${data.composite}<small>/100</small></div>
      <div class="sub">weighted composite · model ${esc(data.model)}</div>
    </div>
    <div class="grid">${cards}</div>${flags}${links}`;
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go");
  btn.disabled = true; out.innerHTML = `<p class="sub">Scoring…</p>`;
  try {
    const body = { repo_path: document.getElementById("repo").value.trim() };
    const m = document.getElementById("model").value.trim();
    const c = document.getElementById("challenge").value.trim();
    if (m) body.model = m;
    if (c) body.challenge = c;
    for (const id of ["app_live_link","deck_link","demo_video_link","prototype_brief","linkedin_post_link"]) {
      const v = document.getElementById(id).value.trim();
      if (v) body[id] = v;
    }
    const r = await fetch("/api/score", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
    });
    if (!r.ok) { const {detail} = await r.json().catch(()=>({detail:r.statusText})); throw new Error(detail); }
    render(await r.json());
  } catch (err) {
    out.innerHTML = `<p class="err">Couldn't score that: ${esc(err.message)}</p>`;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
